name: Auto Update Market Data

on:
  schedule:
    # Lịch chạy tự động: Cứ mỗi 30 phút (hoặc bạn có thể đổi thành '0 * * * *' là mỗi 1 giờ)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất cứ lúc nào trên giao diện GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền để Actions có thể ghi đè/commit file lên repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run update script
        run: node update.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update market data via GitHub Actions"
          branch: main
