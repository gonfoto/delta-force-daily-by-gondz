name: Auto Crawl Delta Force Daily Code

on:
  schedule:
    # Chạy tự động mỗi 8 tiếng (vào 00:00, 08:00, 16:00 UTC)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Nút bấm chạy thủ công bất kỳ lúc nào

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi file data.json
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler Script
        run: python crawler.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update daily codes" || exit 0
          git push
