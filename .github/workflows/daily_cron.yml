name: Auto Crawl Delta Force Daily Code

on:
  schedule:
    # Tự động chạy vào lúc 8h01 sáng giờ Việt Nam (tương đương 1:01 UTC) mỗi ngày
    - cron: '1 1 * * *'
  workflow_dispatch: # Nút bấm chạy thủ công

jobs:
  crawl:
    runs-on: ubuntu-latest
# ... (giữ nguyên phần còn lại của file) ...
    permissions:
      contents: write # Cấp quyền ghi file data.json
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Đã nâng cấp lên v4 (sử dụng Node mới)

      - name: Setup Python
        uses: actions/setup-python@v5 # Đã nâng cấp lên v5 (sử dụng Node mới)
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler Script
        run: python crawler.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update daily codes" || exit 0
          git push
